<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product details</title>
</head>

<body>
    <p>Laptop</p>
    <p>5000</p>
    <span>- 4 star</span>
</body>
<script>
    //   change the product detials from the laptop to gaming laptop 
    //   and price from 5000 to 50000 and from 4 start 4.5 star.
    let paragraphs = document.querySelectorAll("p");
    paragraphs[0].textContent="Gaming Laptop";
    paragraphs[1].textContent=50000;
    document.querySelector("span").textContent="- 4.5 star";
</script>

</html>
