<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">
    <!-- Navbar  -->
    <div class="bg-gray-800 h-10 flex justify-between text-white py-2 px-4">
        <div class="font-semibold text-lg">
            Logo
        </div>
        <div class="flex gap-4 font-normal text-sm">
            <div>Dashboard</div>
            <div>Courses</div>
            <div>Profile</div>
        </div>
    </div>

    <!-- About Section-->
    <div class="p-6 m-6">
        <h1 class="text-gray-800 font-bold">Welcome to Shopify</h1>
        <h1 class="text-gray-500">Continue shopping and shinning</h1>
    </div>

    <!-- Stats Section -->
    <div class="p-2 m-2 flex justify-between p-2">
        <div class="w-80 h-20  bg-white text-center shadow">
            <div class="mt-2">Courses</div>
            <div class="m-2">5</div>
        </div>

        <div class="w-80 h-20 bg-white bg-sky-50 text-center shadow">

            <div class="m-2">4</div>
        </div>

        <div class="w-80 h-20 bg-white bg-sky-50 text-center shadow">
            <div class="mt-2">Progress</div>
            <div class="m-2">8</div>
        </div>

    </div>


    <!-- My courses -->
    <h1 class="p-6 font-semiboldd">My Courses</h1>

    <div class="flex justify-between ">

        <div class="p-4 m-4 w-40 md:w-80  bg-white shadow rounded-lg">
            <div>HTML & CSS</div>
            <div class="">Progress: 80%</div>
            <div class="mt-2">
                <div class="h-2  w-[100%] bg-gray-500">
                    <div class="h-2 w-[80%] bg-blue-500"></div>
                </div>
            </div>
            <button class="bg-blue-500 mt-2 text-white rounded-sm">Continue Learning</button>
        </div>

        <div class="p-4 m-4 w-40 md:w-80 bg-white shadow rounded-lg">
            <div>JavaScript</div>
            <div class="">Progress: 80%</div>
            <div class="mt-2">
                <div class="h-2  w-[100%] bg-gray-500">
                    <div class="h-2 w-[80%] bg-blue-500"></div>
                </div>
            </div>
            <button class="bg-blue-500 w-40 mt-2 text-white rounded-sm">Continue Learning </button>
        </div>

        <div class="p-4 m-4 w-40 md:w-80 bg-white shadow rounded-lg">
            <div>HTML & CSS</div>
            <div class="">Progress: 80%</div>
            <div class="mt-2">
                <div class="h-2  w-[100%] bg-gray-500">
                    <div class="h-2 w-[80%] bg-blue-500"></div>
                </div>
            </div>
            <button class="bg-blue-500 mt-2 text-white rounded-sm">Continue Learning</button>
        </div>
    </div>


</body>

</html>
